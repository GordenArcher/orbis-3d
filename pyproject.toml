[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-3d"
version = "0.1.0"
description = "Turn a single walkaround video into a 3D Gaussian Splat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orbis = "orbis_3d.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orbis_3d*"]
